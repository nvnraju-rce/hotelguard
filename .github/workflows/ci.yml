name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Unit and pipeline tests
        run: python -m unittest discover -s tests -v

      - name: Offline demo run must catch every injected fraud
        run: |
          python hotelguard.py --offline --as-of 2026-10-29 --db "" --out "$RUNNER_TEMP/out" | tee "$RUNNER_TEMP/demo.txt"
          grep -q "recall=1.00" "$RUNNER_TEMP/demo.txt"

      - name: Upload sample report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: ${{ runner.temp }}/out/
          retention-days: 14

  dashboard:
    name: Dashboard (Streamlit AppTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docker.txt
      - run: pip install -r requirements-docker.txt
      - name: Render the dashboard headlessly against demo data
        run: python -m unittest tests.test_dashboard -v

  shell:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning docker-entrypoint.sh monitor.sh

  docker:
    name: Docker build and smoke test
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hotelguard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the dashboard container
        run: |
          docker run -d --name hg -p 8501:8501 \
            -e HOTELGUARD_SEED_DEMO=1 hotelguard:ci

      - name: Wait for the Streamlit health endpoint
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8501/_stcore/health >/dev/null; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "dashboard did not become healthy"; docker logs hg; exit 1

      - name: Check seeding, non-root user and a one-shot run
        run: |
          docker exec hg python -c "import os,store; c=store.connect(os.environ['HOTELGUARD_DB']); assert len(store.runs(c))==3, 'demo history missing'"
          test "$(docker exec hg id -u)" = "10001"
          docker run --rm -e HOTELGUARD_DB=/tmp/t.db hotelguard:ci \
            python hotelguard.py --offline --as-of 2026-10-29 --out /tmp/out | tee run.txt
          grep -q "recall=1.00" run.txt

      - name: Container logs on failure
        if: failure()
        run: docker logs hg || true

  publish:
    name: Publish image to GHCR
    needs: [test, dashboard, shell, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
